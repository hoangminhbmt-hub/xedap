<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 1180" width="1010" height="1180"
     font-family="DejaVu Sans, Verdana, Arial, sans-serif">
  <style>
    .box { fill: #fff; stroke: #000; stroke-width: 6; }
    .pin-on { fill: #000; stroke: #000; stroke-width: 4; }
    .pin-off { fill: #fff; stroke: #000; stroke-width: 4; }
    .pin-on-t { fill: #fff; font-size: 22px; font-weight: bold; text-anchor: middle; }
    .pin-off-t { fill: #000; font-size: 22px; text-anchor: middle; }
    .sig { stroke: #000; stroke-width: 3.5; fill: none; }
    .gnd { stroke: #000; stroke-width: 9; fill: none; stroke-linejoin: miter; }
    .vbat { stroke: #000; stroke-width: 4; fill: none; stroke-dasharray: 22 10 5 10; }
    .title { font-size: 28px; font-weight: bold; text-anchor: middle; }
    .sub { font-size: 16px; text-anchor: middle; }
    .lbl { font-size: 15px; }
  </style>
  <rect width="1010" height="1180" fill="#fff"/>

  <!-- Tiêu đề -->
  <text x="505" y="58" font-size="34" font-weight="bold" text-anchor="middle">XE ĐẠP ESP32-C3 · SƠ ĐỒ NỐI DÂY v1.1</text>

  <!-- Board -->
  <rect x="360" y="90" width="280" height="880" rx="24" fill="#fff" stroke="#000" stroke-width="8"/>
  <rect x="462" y="110" width="76" height="590" rx="14" fill="#fff" stroke="#000" stroke-width="4"/>
  <text transform="translate(514,405) rotate(-90)" font-size="40" font-weight="bold" text-anchor="middle">ESP32-C3</text>
  <text transform="translate(530,600) rotate(-90)" font-size="18" text-anchor="middle">SuperMini</text>

  <!-- Dây nguồn & tín hiệu (vẽ dưới các ô chân) -->
  <polyline class="gnd" points="950,812 980,812 980,862 30,862 30,360 200,360 200,330"/>
  <polyline class="vbat" points="455,812 60,812 60,110 200,110 200,130"/>
  <polyline class="vbat" points="545,812 660,812 660,718 680,718"/>
  <line class="sig" x1="200" y1="200" x2="200" y2="260"/>
  <line class="sig" x1="200" y1="230" x2="372" y2="230"/>
  <line class="sig" x1="628" y1="370" x2="680" y2="370"/>

  <!-- Điểm nối nguồn -->
  <circle cx="60" cy="110" r="7"/>
  <circle cx="30" cy="360" r="7"/>
  <circle cx="200" cy="230" r="8"/>
  <circle cx="660" cy="718" r="7"/>
  <circle cx="980" cy="812" r="7"/>

  <!-- Chân trái -->
  <rect class="pin-off" x="372" y="135" width="76" height="50" rx="8"/><text class="pin-off-t" x="410" y="168">IO4</text>
  <rect class="pin-on"  x="372" y="205" width="76" height="50" rx="8"/><text class="pin-on-t"  x="410" y="238">IO3</text>
  <rect class="pin-off" x="372" y="275" width="76" height="50" rx="8"/><text class="pin-off-t" x="410" y="308">IO2</text>
  <rect class="pin-off" x="372" y="345" width="76" height="50" rx="8"/><text class="pin-off-t" x="410" y="378">IO1</text>
  <rect class="pin-off" x="372" y="415" width="76" height="50" rx="8"/><text class="pin-off-t" x="410" y="448">IO0</text>

  <!-- Chân phải -->
  <rect class="pin-off" x="552" y="135" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="168">IO5</text>
  <rect class="pin-off" x="552" y="205" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="238">IO6</text>
  <rect class="pin-off" x="552" y="275" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="308">IO7</text>
  <rect class="pin-on"  x="552" y="345" width="76" height="50" rx="8"/><text class="pin-on-t"  x="590" y="378">IO8</text>
  <rect class="pin-off" x="552" y="415" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="448">IO9</text>
  <rect class="pin-off" x="552" y="485" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="518">IO10</text>
  <rect class="pin-off" x="552" y="555" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="588">IO20</text>
  <rect class="pin-off" x="552" y="625" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="658">IO21</text>

  <!-- Chân nguồn -->
  <rect class="pin-off" x="455" y="740" width="90" height="44" rx="8"/><text x="500" y="771" font-size="24" font-weight="bold" text-anchor="middle">3V3</text>
  <rect class="pin-off" x="455" y="790" width="90" height="44" rx="8"/><text x="500" y="821" font-size="24" font-weight="bold" text-anchor="middle">5V</text>
  <rect class="pin-off" x="455" y="840" width="90" height="44" rx="8"/><text x="500" y="871" font-size="24" font-weight="bold" text-anchor="middle">GND</text>

  <!-- USB & nút -->
  <rect class="pin-off" x="385" y="905" width="110" height="46" rx="8"/><text x="440" y="936" font-size="22" font-weight="bold" text-anchor="middle">USB</text>
  <rect class="pin-off" x="505" y="905" width="70" height="46" rx="8"/><text x="540" y="933" font-size="15" font-weight="bold" text-anchor="middle">BOOT</text>
  <rect class="pin-off" x="585" y="905" width="45" height="46" rx="8"/><text x="607" y="933" font-size="15" font-weight="bold" text-anchor="middle">RST</text>

  <!-- Cầu chia đo pin: Pin(+) ─ R1 ─ điểm giữa (IO3) ─ R2 ─ GND -->
  <text class="lbl" x="75" y="102">từ Pin (+)</text>
  <rect x="186" y="130" width="28" height="70" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="226" y="160" font-size="18" font-weight="bold">R1</text>
  <text x="226" y="181" font-size="16">220k</text>
  <text x="290" y="220" font-size="14" text-anchor="middle">điểm giữa</text>
  <rect x="186" y="260" width="28" height="70" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="226" y="290" font-size="18" font-weight="bold">R2</text>
  <text x="226" y="311" font-size="16">220k</text>
  <text class="lbl" x="75" y="352">về GND</text>
  <text x="185" y="405" font-size="20" font-weight="bold" text-anchor="middle">CẦU CHIA ÁP ĐO PIN</text>
  <text class="sub" x="185" y="428">pin 4.2V → điểm giữa 2.1V</text>

  <!-- Hình hàn thực tế -->
  <rect x="70" y="470" width="260" height="290" rx="10" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="200" y="497" font-size="17" font-weight="bold" text-anchor="middle">CÁCH HÀN THỰC TẾ</text>
  <text x="200" y="526" font-size="14" text-anchor="middle">dây từ Pin (+)</text>
  <line class="sig" x1="200" y1="533" x2="200" y2="550"/>
  <rect x="188" y="550" width="24" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="3"/>
  <line x1="188" y1="562" x2="212" y2="562" stroke="#000" stroke-width="3"/>
  <line x1="188" y1="575" x2="212" y2="575" stroke="#000" stroke-width="3"/>
  <line x1="188" y1="588" x2="212" y2="588" stroke="#000" stroke-width="3"/>
  <text x="222" y="580" font-size="14" font-weight="bold">R1 220k</text>
  <line class="sig" x1="200" y1="600" x2="200" y2="655"/>
  <circle cx="200" cy="628" r="8"/>
  <text x="186" y="620" font-size="13" text-anchor="end">xoắn 2 chân</text>
  <text x="186" y="637" font-size="13" text-anchor="end">+ hàn chung</text>
  <line class="sig" x1="200" y1="628" x2="300" y2="628"/>
  <text x="255" y="621" font-size="13" text-anchor="middle">dây → IO3</text>
  <rect x="188" y="655" width="24" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="3"/>
  <line x1="188" y1="667" x2="212" y2="667" stroke="#000" stroke-width="3"/>
  <line x1="188" y1="680" x2="212" y2="680" stroke="#000" stroke-width="3"/>
  <line x1="188" y1="693" x2="212" y2="693" stroke="#000" stroke-width="3"/>
  <text x="222" y="685" font-size="14" font-weight="bold">R2 220k</text>
  <line class="sig" x1="200" y1="705" x2="200" y2="725"/>
  <text x="200" y="745" font-size="14" text-anchor="middle">dây về GND</text>

  <!-- Thiết bị: LED trên mạch -->
  <rect class="box" x="680" y="326" width="270" height="88" rx="10"/>
  <text class="lbl" x="688" y="348">LED</text>
  <text x="815" y="378" font-size="22" font-weight="bold" text-anchor="middle">LED TRÊN MẠCH</text>
  <text class="sub" x="815" y="401">có sẵn · nháy khi Tìm xe</text>

  <!-- Thiết bị: pin 18650 -->
  <rect class="box" x="680" y="700" width="270" height="130" rx="10"/>
  <text x="690" y="727" font-size="22" font-weight="bold">+</text>
  <text x="940" y="822" font-size="22" font-weight="bold" text-anchor="end">−</text>
  <text class="title" x="815" y="762">PIN 18650</text>
  <text class="sub" x="815" y="789">Li-ion 3.7V</text>
  <text class="sub" x="815" y="811">tháo ra sạc rời</text>

  <!-- Chú thích -->
  <line class="sig" x1="40" y1="1015" x2="140" y2="1015"/>
  <text x="155" y="1022" font-size="18">tín hiệu</text>
  <line class="vbat" x1="40" y1="1050" x2="140" y2="1050"/>
  <text x="155" y="1057" font-size="18">VBAT 3.0–4.2V (pin 18650 → chân 5V)</text>
  <line class="gnd" x1="40" y1="1085" x2="140" y2="1085"/>
  <text x="155" y="1092" font-size="18">GND</text>
  <circle cx="760" cy="1015" r="7"/>
  <text x="775" y="1022" font-size="18">= điểm nối nguồn</text>

  <text x="40" y="1135" font-size="17" font-weight="bold">⚠ Pin (+) nối chân 5V – KHÔNG nối chân 3V3 (pin đầy 4.2V sẽ hỏng chip)</text>
  <text x="40" y="1162" font-size="17" font-weight="bold">⚠ Tháo pin trước khi cắm cáp USB để nạp code</text>
</svg>
