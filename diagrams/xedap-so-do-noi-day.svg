<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 1260" width="1010" height="1260"
     font-family="DejaVu Sans, Verdana, Arial, sans-serif">
  <style>
    .pin-on { fill: #000; stroke: #000; stroke-width: 4; }
    .pin-off { fill: #fff; stroke: #000; stroke-width: 4; }
    .pin-on-t { fill: #fff; font-size: 22px; font-weight: bold; text-anchor: middle; }
    .pin-off-t { fill: #000; font-size: 22px; text-anchor: middle; }
    .sig { stroke: #000; stroke-width: 3.5; fill: none; }
    .gnd { stroke: #000; stroke-width: 9; fill: none; stroke-linejoin: miter; }
    .vbat { stroke: #000; stroke-width: 4; fill: none; stroke-dasharray: 22 10 5 10; }
    .v33 { stroke: #000; stroke-width: 4; fill: none; stroke-dasharray: 3 7; stroke-linecap: round; }
    .box { fill: #fff; stroke: #000; stroke-width: 6; }
    .res { fill: #fff; stroke: #000; stroke-width: 4; }
    .rbody { fill: #fff; stroke: #000; stroke-width: 3; }
    .band { stroke: #000; stroke-width: 3; }
    .sub { font-size: 16px; text-anchor: middle; }
    .lbl { font-size: 15px; }
  </style>
  <rect width="1010" height="1260" fill="#fff"/>

  <text x="505" y="52" font-size="34" font-weight="bold" text-anchor="middle">XE ĐẠP ESP32-C3 · SƠ ĐỒ NỐI DÂY v3.2</text>
  <text x="505" y="78" font-size="16" text-anchor="middle">Mọi dây ở MỘT hàng chân (bên trái) · không đèn · không còi</text>

  <!-- Board -->
  <rect x="380" y="95" width="260" height="830" rx="24" fill="#fff" stroke="#000" stroke-width="8"/>
  <rect class="pin-off" x="460" y="105" width="100" height="46" rx="8"/>
  <text x="510" y="136" font-size="22" font-weight="bold" text-anchor="middle">USB</text>
  <rect x="482" y="180" width="56" height="560" rx="12" fill="#fff" stroke="#000" stroke-width="4"/>
  <text transform="translate(520,460) rotate(-90)" font-size="38" font-weight="bold" text-anchor="middle">ESP32-C3</text>
  <text transform="translate(520,680) rotate(-90)" font-size="16" text-anchor="middle">SuperMini</text>
  <rect class="pin-off" x="430" y="850" width="74" height="44" rx="8"/>
  <text x="467" y="878" font-size="15" font-weight="bold" text-anchor="middle">BOOT</text>
  <rect class="pin-off" x="520" y="850" width="60" height="44" rx="8"/>
  <text x="550" y="878" font-size="15" font-weight="bold" text-anchor="middle">RST</text>
  <text x="510" y="790" font-size="13" text-anchor="middle">nhìn mặt có linh kiện,</text>
  <text x="510" y="808" font-size="13" text-anchor="middle">cổng USB hướng lên</text>

  <!-- ===== Dây (vẽ dưới ô chân) ===== -->
  <!-- VBAT: Pin(+) → làn ngoài → chân 5V -->
  <polyline class="vbat" points="110,1045 30,1045 30,215 392,215"/>
  <!-- GND: Pin(−) → làn trong → chân GND -->
  <polyline class="gnd" points="110,995 60,995 60,285 392,285"/>
  <!-- MPU GND (chân trên) lên thanh GND -->
  <line class="gnd" x1="200" y1="320" x2="200" y2="285"/>
  <!-- MPU VCC → 3V3 -->
  <line class="v33" x1="310" y1="355" x2="392" y2="355"/>
  <!-- MPU tín hiệu -->
  <line class="sig" x1="310" y1="425" x2="392" y2="425"/>
  <line class="sig" x1="310" y1="495" x2="392" y2="495"/>
  <line class="sig" x1="310" y1="635" x2="392" y2="635"/>
  <!-- Cầu chia: VBAT (bắc qua dây GND) → R1 → R2 → điểm giữa → IO0, R3 → GND -->
  <path class="vbat" d="M30,720 H49 A11,11 0 0 1 71,720 H220 V735"/>
  <line class="sig" x1="220" y1="775" x2="220" y2="795"/>
  <line class="sig" x1="220" y1="835" x2="220" y2="875"/>
  <polyline class="sig" points="220,855 360,855 360,705 392,705"/>
  <polyline class="gnd" points="220,915 220,935 60,935"/>

  <!-- Điểm nối -->
  <circle cx="30" cy="720" r="7"/>
  <circle cx="60" cy="935" r="7"/>
  <circle cx="200" cy="285" r="7"/>
  <circle cx="220" cy="855" r="8"/>

  <!-- ===== Chân trái (đều dùng, trừ IO2) ===== -->
  <rect class="pin-on"  x="392" y="190" width="76" height="50" rx="8"/><text class="pin-on-t"  x="430" y="223">5V</text>
  <rect class="pin-on"  x="392" y="260" width="76" height="50" rx="8"/><text class="pin-on-t"  x="430" y="293">GND</text>
  <rect class="pin-on"  x="392" y="330" width="76" height="50" rx="8"/><text class="pin-on-t"  x="430" y="363">3V3</text>
  <rect class="pin-on"  x="392" y="400" width="76" height="50" rx="8"/><text class="pin-on-t"  x="430" y="433">IO4</text>
  <rect class="pin-on"  x="392" y="470" width="76" height="50" rx="8"/><text class="pin-on-t"  x="430" y="503">IO3</text>
  <rect class="pin-off" x="392" y="540" width="76" height="50" rx="8"/><text class="pin-off-t" x="430" y="573">IO2</text>
  <rect class="pin-on"  x="392" y="610" width="76" height="50" rx="8"/><text class="pin-on-t"  x="430" y="643">IO1</text>
  <rect class="pin-on"  x="392" y="680" width="76" height="50" rx="8"/><text class="pin-on-t"  x="430" y="713">IO0</text>

  <!-- ===== Chân phải (không dùng) ===== -->
  <rect class="pin-off" x="552" y="190" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="223">IO5</text>
  <rect class="pin-off" x="552" y="260" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="293">IO6</text>
  <rect class="pin-off" x="552" y="330" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="363">IO7</text>
  <rect class="pin-off" x="552" y="400" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="433">IO8</text>
  <rect class="pin-off" x="552" y="470" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="503">IO9</text>
  <rect class="pin-off" x="552" y="540" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="573">IO10</text>
  <rect class="pin-off" x="552" y="610" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="643">IO20</text>
  <rect class="pin-off" x="552" y="680" width="76" height="50" rx="8"/><text class="pin-off-t" x="590" y="713">IO21</text>
  <text x="680" y="470" font-size="17" font-weight="bold">← hàng phải: KHÔNG hàn gì</text>

  <!-- ===== MPU-6050 ===== -->
  <rect class="box" x="110" y="320" width="200" height="345" rx="10"/>
  <text class="lbl" x="200" y="342" text-anchor="middle">GND</text>
  <text class="lbl" x="302" y="360" text-anchor="end">VCC</text>
  <text class="lbl" x="302" y="430" text-anchor="end">SCL</text>
  <text class="lbl" x="302" y="500" text-anchor="end">SDA</text>
  <text class="lbl" x="302" y="545" text-anchor="end">XDA –</text>
  <text class="lbl" x="302" y="570" text-anchor="end">XCL –</text>
  <text class="lbl" x="302" y="595" text-anchor="end">AD0 –</text>
  <text class="lbl" x="302" y="640" text-anchor="end">INT</text>
  <text x="185" y="420" font-size="20" font-weight="bold" text-anchor="middle">MPU-6050</text>
  <text x="178" y="444" font-size="16" text-anchor="middle">GY-521</text>
  <text x="178" y="468" font-size="14" text-anchor="middle">cảm biến rung</text>
  <text x="170" y="618" font-size="13" text-anchor="middle">– = bỏ trống</text>

  <!-- ===== Cầu chia 1/3 ===== -->
  <rect class="res" x="206" y="735" width="28" height="40"/>
  <text x="244" y="761" font-size="17"><tspan font-weight="bold">R1</tspan> 220k</text>
  <rect class="res" x="206" y="795" width="28" height="40"/>
  <text x="244" y="821" font-size="17"><tspan font-weight="bold">R2</tspan> 220k</text>
  <text x="290" y="848" font-size="13" text-anchor="middle">điểm giữa</text>
  <rect class="res" x="206" y="875" width="28" height="40"/>
  <text x="244" y="901" font-size="17"><tspan font-weight="bold">R3</tspan> 220k</text>
  <text x="100" y="712" font-size="13">từ Pin (+)</text>
  <text x="80" y="790" font-size="15" font-weight="bold">ĐO PIN</text>
  <text x="80" y="810" font-size="13">chia 1/3</text>
  <text x="80" y="828" font-size="13">5.6V → 1.87V</text>

  <!-- ===== 4 pin AA ===== -->
  <rect class="box" x="110" y="960" width="230" height="115" rx="10"/>
  <text x="122" y="1003" font-size="22" font-weight="bold">−</text>
  <text x="120" y="1054" font-size="22" font-weight="bold">+</text>
  <text x="235" y="998" font-size="24" font-weight="bold" text-anchor="middle">4 × PIN AA</text>
  <text class="sub" x="235" y="1022">sạc NiMH 1.2V · 4.8V</text>
  <text class="sub" x="235" y="1043">tháo ra sạc rời</text>
  <text x="235" y="1064" font-size="13" font-weight="bold" text-anchor="middle">KHÔNG dùng pin 1.5V</text>

  <!-- ===== Cách hàn thực tế cầu chia ===== -->
  <rect x="680" y="560" width="300" height="330" rx="10" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="830" y="588" font-size="17" font-weight="bold" text-anchor="middle">CÁCH HÀN CẦU CHIA</text>
  <text x="830" y="614" font-size="14" text-anchor="middle">dây từ Pin (+)</text>
  <line class="sig" x1="830" y1="621" x2="830" y2="636"/>
  <rect class="rbody" x="818" y="636" width="24" height="40" rx="8"/>
  <line class="band" x1="818" y1="649" x2="842" y2="649"/><line class="band" x1="818" y1="663" x2="842" y2="663"/>
  <text x="852" y="661" font-size="14" font-weight="bold">R1 220k</text>
  <line class="sig" x1="830" y1="676" x2="830" y2="694"/>
  <rect class="rbody" x="818" y="694" width="24" height="40" rx="8"/>
  <line class="band" x1="818" y1="707" x2="842" y2="707"/><line class="band" x1="818" y1="721" x2="842" y2="721"/>
  <text x="852" y="719" font-size="14" font-weight="bold">R2 220k</text>
  <line class="sig" x1="830" y1="734" x2="830" y2="784"/>
  <circle cx="830" cy="759" r="8"/>
  <text x="816" y="752" font-size="13" text-anchor="end">xoắn chân</text>
  <text x="816" y="769" font-size="13" text-anchor="end">+ hàn chung</text>
  <line class="sig" x1="830" y1="759" x2="930" y2="759"/>
  <text x="885" y="752" font-size="13" text-anchor="middle">dây → IO0</text>
  <rect class="rbody" x="818" y="784" width="24" height="40" rx="8"/>
  <line class="band" x1="818" y1="797" x2="842" y2="797"/><line class="band" x1="818" y1="811" x2="842" y2="811"/>
  <text x="852" y="809" font-size="14" font-weight="bold">R3 220k</text>
  <line class="sig" x1="830" y1="824" x2="830" y2="841"/>
  <text x="830" y="861" font-size="14" text-anchor="middle">dây về GND</text>

  <!-- ===== Bảng nối nhanh ===== -->
  <rect x="680" y="190" width="300" height="240" rx="10" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="830" y="218" font-size="17" font-weight="bold" text-anchor="middle">NỐI NHANH</text>
  <text x="696" y="248" font-size="15">Pin (+)  → 5V</text>
  <text x="696" y="272" font-size="15">Pin (−)  → GND</text>
  <text x="696" y="296" font-size="15">MPU VCC → 3V3</text>
  <text x="696" y="320" font-size="15">MPU GND → GND</text>
  <text x="696" y="344" font-size="15">MPU SCL → IO4</text>
  <text x="696" y="368" font-size="15">MPU SDA → IO3</text>
  <text x="696" y="392" font-size="15">MPU INT → IO1</text>
  <text x="696" y="416" font-size="15">Cầu chia (giữa) → IO0</text>

  <!-- ===== Chú thích ===== -->
  <line class="sig" x1="40" y1="1120" x2="140" y2="1120"/>
  <text x="155" y="1127" font-size="18">tín hiệu</text>
  <line class="vbat" x1="40" y1="1155" x2="140" y2="1155"/>
  <text x="155" y="1162" font-size="18">VBAT 4.2–5.6V (pin → chân 5V)</text>
  <line class="gnd" x1="40" y1="1190" x2="140" y2="1190"/>
  <text x="155" y="1197" font-size="18">GND</text>
  <line class="v33" x1="300" y1="1190" x2="400" y2="1190"/>
  <text x="415" y="1197" font-size="18">3V3</text>
  <circle cx="620" cy="1120" r="7"/>
  <text x="635" y="1127" font-size="18">= điểm nối</text>
  <path class="sig" d="M600,1162 H611 A9,9 0 0 1 629,1162 H640"/>
  <line x1="620" y1="1148" x2="620" y2="1178" stroke="#000" stroke-width="6"/>
  <text x="655" y="1167" font-size="18">= bắc qua, KHÔNG nối</text>

  <text x="40" y="1230" font-size="16" font-weight="bold">⚠ Chỉ dùng pin sạc NiMH 1.2V (pin 1.5V hỏng mạch) · Tháo pin trước khi cắm USB nạp code</text>
  <text x="40" y="1252" font-size="16" font-weight="bold">⚠ Gỡ đèn đỏ trên ESP32-C3 và đèn trên GY-521 để ngủ tốn ít pin nhất</text>
</svg>
